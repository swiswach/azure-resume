name: Convert Resume DOCX and Deploy to Development

on:
  push:
    branches:
      - docx-conversion

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install python-docx

      - run: |
          mkdir -p site
          python convert_resume.py

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_BEACH_000F72E10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "site"
          output_location: ""
          skip_app_build: true
          skip_api_build: true
