name: Convert Resume DOCX to HTML

on:
  push:
    branches:
      - docx-conversion
    paths:
      - "resume.docx"
      - ".github/workflows/convert-resume.yml"

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert resume.docx to HTML
        run: |
          mkdir -p site
          pandoc resume.docx \
            --standalone \
            --output=site/index.html

      - name: Upload converted HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-resume
          path: site/index.html
