name: Convert Resume DOCX to HTML and Deploy

on:
  push:
    branches:
      - docx-conversion
    paths:
      - "resume.docx"
      - ".github/workflows/convert-resume.yml"

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert resume.docx to HTML
        run: |
          mkdir -p site
          pandoc resume.docx \
            --standalone \
            --output=site/index.html

      - name: Deploy converted resume to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_ISLAND_0D1A93610 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "site"
          api_location: ""
          output_location: ""
          skip_app_build: true
